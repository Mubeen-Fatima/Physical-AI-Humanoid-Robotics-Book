<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2680eb;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#1557a0;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="robotGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2680eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1557a0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="20"/>

  <!-- Robot body -->
  <g transform="translate(200, 200)">
    <!-- Main body -->
    <rect x="-60" y="0" width="120" height="100" rx="10" fill="url(#robotGrad)" stroke="#ffffff" stroke-width="3"/>

    <!-- Head -->
    <rect x="-50" y="-80" width="100" height="70" rx="8" fill="url(#robotGrad)" stroke="#ffffff" stroke-width="3"/>

    <!-- Antenna -->
    <line x1="0" y1="-90" x2="0" y2="-80" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-93" r="5" fill="#ffffff"/>

    <!-- Eyes -->
    <circle cx="-25" cy="-50" r="10" fill="#ffffff"/>
    <circle cx="25" cy="-50" r="10" fill="#ffffff"/>
    <circle cx="-25" cy="-50" r="5" fill="#2680eb"/>
    <circle cx="25" cy="-50" r="5" fill="#2680eb"/>

    <!-- Mouth display -->
    <rect x="-30" y="-30" width="60" height="15" rx="5" fill="#ffffff" opacity="0.8"/>
    <line x1="-25" y1="-22.5" x2="-15" y2="-22.5" stroke="#2680eb" stroke-width="2"/>
    <line x1="-10" y1="-22.5" x2="0" y2="-22.5" stroke="#2680eb" stroke-width="2"/>
    <line x1="5" y1="-22.5" x2="15" y2="-22.5" stroke="#2680eb" stroke-width="2"/>
    <line x1="20" y1="-22.5" x2="25" y2="-22.5" stroke="#2680eb" stroke-width="2"/>

    <!-- Chest panel -->
    <rect x="-35" y="20" width="70" height="50" rx="5" fill="#ffffff" opacity="0.3"/>
    <circle cx="0" cy="45" r="15" fill="#ffffff" opacity="0.6"/>

    <!-- Arms -->
    <rect x="-75" y="10" width="12" height="60" rx="6" fill="url(#robotGrad)" stroke="#ffffff" stroke-width="2"/>
    <rect x="63" y="10" width="12" height="60" rx="6" fill="url(#robotGrad)" stroke="#ffffff" stroke-width="2"/>

    <!-- Hands -->
    <circle cx="-69" cy="75" r="8" fill="#2680eb" stroke="#ffffff" stroke-width="2"/>
    <circle cx="69" cy="75" r="8" fill="#2680eb" stroke="#ffffff" stroke-width="2"/>

    <!-- Legs -->
    <rect x="-40" y="100" width="25" height="50" rx="6" fill="url(#robotGrad)" stroke="#ffffff" stroke-width="2"/>
    <rect x="15" y="100" width="25" height="50" rx="6" fill="url(#robotGrad)" stroke="#ffffff" stroke-width="2"/>

    <!-- Feet -->
    <ellipse cx="-27.5" cy="155" rx="18" ry="8" fill="#2680eb" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="27.5" cy="155" rx="18" ry="8" fill="#2680eb" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Floating elements (gears/cogs) -->
  <g opacity="0.4">
    <circle cx="50" cy="50" r="15" fill="none" stroke="#2680eb" stroke-width="2"/>
    <line x1="50" y1="35" x2="50" y2="45" stroke="#2680eb" stroke-width="2"/>
    <line x1="50" y1="55" x2="50" y2="65" stroke="#2680eb" stroke-width="2"/>
    <line x1="35" y1="50" x2="45" y2="50" stroke="#2680eb" stroke-width="2"/>
    <line x1="55" y1="50" x2="65" y2="50" stroke="#2680eb" stroke-width="2"/>
  </g>

  <g opacity="0.3">
    <circle cx="350" cy="80" r="20" fill="none" stroke="#1557a0" stroke-width="2"/>
    <line x1="350" y1="60" x2="350" y2="72" stroke="#1557a0" stroke-width="2"/>
    <line x1="350" y1="88" x2="350" y2="100" stroke="#1557a0" stroke-width="2"/>
    <line x1="330" y1="80" x2="342" y2="80" stroke="#1557a0" stroke-width="2"/>
    <line x1="358" y1="80" x2="370" y2="80" stroke="#1557a0" stroke-width="2"/>
  </g>

  <!-- AI text -->
  <text x="200" y="380" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2680eb" text-anchor="middle" opacity="0.6">
    Physical AI
  </text>
</svg>
