<svg width="280" height="380" viewBox="0 0 280 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.8" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="280" height="380" fill="url(#coverGradient)" rx="4"/>

  <!-- Top decorative accent -->
  <rect x="20" y="20" width="240" height="4" fill="url(#accentGradient)" rx="2"/>

  <!-- Robot Icon -->
  <g transform="translate(90, 60)">
    <!-- Head -->
    <rect x="30" y="0" width="40" height="35" rx="4" fill="#60a5fa"/>
    <!-- Antenna -->
    <circle cx="50" cy="-5" r="4" fill="#93c5fd"/>
    <line x1="50" y1="-5" x2="50" y2="0" stroke="#93c5fd" stroke-width="2"/>

    <!-- Eyes -->
    <circle cx="42" cy="12" r="3" fill="#1e40af"/>
    <circle cx="58" cy="12" r="3" fill="#1e40af"/>

    <!-- Smile -->
    <path d="M 40 22 Q 50 28 60 22" stroke="#1e40af" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Body -->
    <rect x="20" y="40" width="60" height="50" rx="6" fill="#60a5fa"/>

    <!-- Arms -->
    <rect x="5" y="45" width="12" height="35" rx="4" fill="#93c5fd"/>
    <rect x="83" y="45" width="12" height="35" rx="4" fill="#93c5fd"/>

    <!-- Legs -->
    <rect x="30" y="95" width="15" height="30" rx="4" fill="#93c5fd"/>
    <rect x="55" y="95" width="15" height="30" rx="4" fill="#93c5fd"/>

    <!-- Details on body -->
    <circle cx="50" cy="55" r="6" fill="#3b82f6"/>
    <rect x="35" y="70" width="30" height="3" rx="1.5" fill="#3b82f6"/>
    <rect x="35" y="78" width="30" height="3" rx="1.5" fill="#3b82f6"/>
  </g>

  <!-- Title -->
  <text x="140" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-0.5">
    PHYSICAL AI
  </text>

  <text x="140" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-0.5">
    &amp; HUMANOID
  </text>

  <text x="140" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-0.5">
    ROBOTICS
  </text>

  <!-- Subtitle -->
  <text x="140" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#dbeafe" text-anchor="middle" opacity="0.9">
    A Comprehensive Guide
  </text>

  <!-- Bottom accent line -->
  <line x1="40" y1="330" x2="240" y2="330" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>

  <!-- Edition/Info -->
  <text x="140" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#bfdbfe" text-anchor="middle">
    26 Chapters • 7 Parts
  </text>

  <text x="140" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#93c5fd" text-anchor="middle" opacity="0.8">
    ROS 2 • Isaac • VLA Models
  </text>
</svg>
